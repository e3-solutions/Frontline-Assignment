[project]
name = "negotiation-shared"
version = "0.1.0"
description = "Shared utilities for negotiation services"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
